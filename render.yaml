# Free deployment: Render Free web service + externally hosted Neon PostgreSQL Free.
# This Blueprint does NOT provision a paid database.
# Set DATABASE_URL and RBM_ADMIN_PASSWORD as private secrets in Render.
services:
  - type: web
    name: ntt-nutrition-rbm
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RBM_ADMIN_PASSWORD
        sync: false
      - key: RBM_REQUIRE_HTTPS
        value: "true"
      - key: RBM_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
