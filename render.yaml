# NTT Nutrition RBM – Git-backed Render Blueprint
# NOTE: Both services use PAID plans. Review the charges and secure admin access
# in Render before pressing Apply. Do not store secrets in GitHub.
services:
  - type: web
    name: ntt-nutrition-rbm
    runtime: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RBM_ADMIN_PASSWORD
        sync: false
      - key: RBM_REQUIRE_HTTPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ntt-nutrition-rbm-postgres
          property: connectionString
databases:
  - name: ntt-nutrition-rbm-postgres
    plan: basic-256mb
    region: singapore
    databaseName: nutrition_rbm
    user: nutrition_rbm_admin
